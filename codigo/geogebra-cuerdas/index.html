<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Diego E. Rodríguez V.">
<title>Envolventes · GeoGebra</title>
<meta name="description" content="Applet de GeoGebra: rectas que dibujan curvas. Una parábola, una astroide y una estrella que no están trazadas en ninguna parte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../notas/nota.css">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (saved === "dark" || (!saved && prefersDark)) document.documentElement.dataset.theme = "dark";
  })();
</script>
<style>
  .app-wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .app-wrap h1 { font-size: 2.3rem; }
  .modos { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.25rem 0 1rem; }
  .modo, .btn {
    font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; color: var(--fg);
    padding: 0.45rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  }
  .modo:hover, .btn:hover { border-color: var(--primary); }
  .modo[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--bg); }
  #ggb { width: 100%; max-width: 820px; aspect-ratio: 3 / 2; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; margin: 1rem 0; font-size: 0.95rem; }
  .controles label { display: inline-flex; align-items: center; gap: 0.5rem; }
  .controles input[type="range"] { accent-color: var(--primary); width: 160px; }
  .controles input[type="checkbox"] { accent-color: var(--primary); width: 1.05rem; height: 1.05rem; }
  .controles output { font-family: var(--mono); min-width: 2ch; color: var(--muted); }
  #formula { font-family: var(--mono); font-size: 0.95rem; color: var(--primary); margin: 0 0 0.25rem; }
  #texto { margin: 0 0 0.75rem; color: var(--fg); }
  #pista { font-size: 0.9rem; color: var(--muted); margin: 0; }
  .btn:disabled { opacity: 0.5; cursor: wait; }
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" aria-label="Cambiar entre modo claro y oscuro">🌙</button>

<main class="app-wrap">
  <a class="volver" id="volver" href="../../">← Volver al portafolio</a>
  <div class="kicker" id="kicker"></div>
  <h1 id="titulo"></h1>
  <p class="meta">Diego E. Rodríguez V.</p>
  <p class="lead" id="intro"></p>

  <div class="modos" id="modos" role="group"></div>
  <div id="ggb"></div>

  <div class="controles">
    <button class="btn" id="anim" type="button" disabled></button>
    <label><span id="l-n"></span> <input id="n" type="range" min="4" max="60" step="1" value="18"> <output id="n-out">18</output></label>
    <label><input id="env" type="checkbox"> <span id="l-env"></span></label>
    <label><input id="rastro" type="checkbox"> <span id="l-rastro"></span></label>
  </div>

  <p id="formula"></p>
  <p id="texto"></p>
  <p id="pista"></p>
</main>

<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<script>
  var en = /[?&]lang=en/.test(location.search);
  var T = en ? {
    kicker: "Applet · GeoGebra", titulo: "Envelopes: straight lines that draw curves",
    intro: "None of these curves is drawn anywhere. They appear on their own, as the edge that a whole family of straight lines grazes.",
    volver: "← Back to the portfolio", volverHref: "../../en/",
    anim: ["▶ Move the live line", "⏸ Pause"], n: "Lines", env: "Show the curve", rastro: "Leave a trail",
    modos: [
      { nombre: "String art", formula: "√x + √y = √a",
        texto: "Each line joins a point on the horizontal axis to a point on the vertical one. None of them is a parabola, but together they draw one.",
        pista: "The orange line sweeps through the family; where it grazes the curve is its point of tangency." },
      { nombre: "Falling ladder", formula: "x^(2/3) + y^(2/3) = a^(2/3)",
        texto: "A ladder of fixed length slides down a wall. Every position is a line, and together they enclose an astroid. The midpoint of the ladder, meanwhile, travels along a circle.",
        pista: "Turn on the curve to see the astroid and the circle traced by the midpoint." },
      { nombre: "Star", formula: "4 parabolas",
        texto: "The same string art in the four quadrants builds a star out of four parabolas.",
        pista: "Add lines until the edges look smooth, then show the curves." }
    ]
  } : {
    kicker: "Applet · GeoGebra", titulo: "Envolventes: rectas que dibujan curvas",
    intro: "Ninguna de estas curvas está dibujada en ninguna parte. Aparecen solas, como el borde que roza una familia entera de rectas.",
    volver: "← Volver al portafolio", volverHref: "../../",
    anim: ["▶ Mover la recta viva", "⏸ Pausar"], n: "Rectas", env: "Mostrar la curva", rastro: "Dejar rastro",
    modos: [
      { nombre: "Cuerdas", formula: "√x + √y = √a",
        texto: "Cada recta une un punto del eje horizontal con uno del vertical. Ninguna es una parábola, pero juntas dibujan una.",
        pista: "La recta naranja recorre la familia; donde roza la curva queda su punto de tangencia." },
      { nombre: "Escalera", formula: "x^(2/3) + y^(2/3) = a^(2/3)",
        texto: "Una escalera de largo fijo se resbala contra la pared. Cada posición es una recta, y juntas encierran una astroide. El punto medio de la escalera, en cambio, recorre un círculo.",
        pista: "Mostrá la curva para ver la astroide y el círculo que traza el punto medio." },
      { nombre: "Estrella", formula: "4 parábolas",
        texto: "Las mismas cuerdas en los cuatro cuadrantes arman una estrella hecha de cuatro parábolas.",
        pista: "Sumá rectas hasta que los bordes se vean lisos y después mostrá las curvas." }
    ]
  };
  document.documentElement.lang = en ? "en" : "es";
  document.title = T.titulo + " · GeoGebra";
  var $ = function (id) { return document.getElementById(id); };
  $("kicker").textContent = T.kicker; $("titulo").textContent = T.titulo; $("intro").textContent = T.intro;
  $("volver").textContent = T.volver; $("volver").href = T.volverHref;
  $("l-n").textContent = T.n; $("l-env").textContent = T.env; $("l-rastro").textContent = T.rastro;

  var api = null, modo = 0, animando = false, s = 0.3, dir = 1, last = 0;
  var A = 10;
  // Objetos de cada modo y cuáles son la "curva" (se ven con la casilla) y el punto vivo (para el rastro)
  var GRUPOS = [
    { fijos: ["cuerdas1"], vivos: ["viva1", "T1"], curvas: ["env1"], rastro: ["T1"], vista: [-2, 16, -1, 11] },
    { fijos: ["cuerdas2"], vivos: ["viva2", "M2", "T2"], curvas: ["env2", "circ2"], rastro: ["M2", "T2"], vista: [-2, 16, -1, 11] },
    { fijos: ["e3a", "e3b", "e3c", "e3d"], vivos: [], curvas: ["env3a", "env3b", "env3c", "env3d"], rastro: [], vista: [-16.5, 16.5, -11, 11] }
  ];
  var TODOS = [];
  GRUPOS.forEach(function (g) { TODOS = TODOS.concat(g.fijos, g.vivos, g.curvas); });

  // Colores del portafolio (se recalculan al cambiar de tema)
  function paleta() {
    var d = document.documentElement.dataset.theme === "dark";
    return {
      fondo: d ? [31, 31, 31] : [250, 250, 249], eje: d ? [140, 140, 140] : [150, 150, 150],
      verde: d ? [52, 211, 176] : [11, 125, 102], naranja: [249, 115, 22], oro: [224, 177, 0], azul: d ? [94, 156, 255] : [13, 110, 253],
      texto: d ? [236, 236, 236] : [22, 22, 22]
    };
  }
  function pintar() {
    var c = paleta();
    // El fondo y los ejes de la vista sólo se cambian reescribiendo su XML (no hay comando que no dependa del idioma)
    var rgb = function (v) { return 'r="' + v[0] + '" g="' + v[1] + '" b="' + v[2] + '"'; };
    api.setXML(api.getXML()
      .replace(/<bgColor [^>]*\/>/, "<bgColor " + rgb(c.fondo) + "/>")
      .replace(/<axesColor [^>]*\/>/, "<axesColor " + rgb(c.eje) + "/>"));
    var col = { cuerdas1: c.verde, cuerdas2: c.verde, e3a: c.verde, e3b: c.naranja, e3c: c.oro, e3d: c.azul,
                viva1: c.naranja, viva2: c.naranja, T1: c.naranja, T2: c.naranja, M2: c.azul,
                env1: c.oro, env2: c.oro, circ2: c.azul, env3a: c.verde, env3b: c.naranja, env3c: c.oro, env3d: c.azul };
    Object.keys(col).forEach(function (k) { api.setColor(k, col[k][0], col[k][1], col[k][2]); });
  }

  function construir() {
    var cmd = [
      "a = " + A, "n = 18", "p = 3", "t = 0.5",
      "cuerdas1 = Sequence(Segment((k a / n, 0), (0, a - k a / n)), k, 0, n)",
      "viva1 = Segment((p, 0), (0, a - p))",
      "T1 = (p^2 / a, (a - p)^2 / a)",
      "env1 = Curve(a u^2, a (1 - u)^2, u, 0, 1)",
      "cuerdas2 = Sequence(Segment((a cos(k π / (2 n)), 0), (0, a sin(k π / (2 n)))), k, 0, n)",
      "viva2 = Segment((a cos(t), 0), (0, a sin(t)))",
      "M2 = (a cos(t) / 2, a sin(t) / 2)",
      "T2 = (a cos(t)^3, a sin(t)^3)",
      "env2 = Curve(a cos(u)^3, a sin(u)^3, u, 0, π / 2)",
      "circ2 = Curve((a / 2) cos(u), (a / 2) sin(u), u, 0, π / 2)",
      "e3a = Sequence(Segment((k a / n, 0), (0, a - k a / n)), k, 0, n)",
      "e3b = Sequence(Segment((-k a / n, 0), (0, a - k a / n)), k, 0, n)",
      "e3c = Sequence(Segment((k a / n, 0), (0, -(a - k a / n))), k, 0, n)",
      "e3d = Sequence(Segment((-k a / n, 0), (0, -(a - k a / n))), k, 0, n)",
      "env3a = Curve(a u^2, a (1 - u)^2, u, 0, 1)",
      "env3b = Curve(-a u^2, a (1 - u)^2, u, 0, 1)",
      "env3c = Curve(a u^2, -a (1 - u)^2, u, 0, 1)",
      "env3d = Curve(-a u^2, -a (1 - u)^2, u, 0, 1)"
    ];
    cmd.forEach(function (c) { api.evalCommand(c); });
    ["a", "n", "p", "t"].forEach(function (k) { api.setVisible(k, false); });
    TODOS.forEach(function (k) {
      api.setLabelVisible(k, false);
      api.setFixed(k, true, false);
    });
    ["cuerdas1", "cuerdas2", "e3a", "e3b", "e3c", "e3d"].forEach(function (k) { api.setLineThickness(k, 2); });
    ["viva1", "viva2"].forEach(function (k) { api.setLineThickness(k, 6); });
    ["env1", "env2", "env3a", "env3b", "env3c", "env3d"].forEach(function (k) { api.setLineThickness(k, 7); });
    api.setLineThickness("circ2", 3); api.setLineStyle("circ2", 1);
    ["T1", "T2", "M2"].forEach(function (k) { api.setPointSize(k, 6); });
    api.setGridVisible(false);
    pintar();
  }

  function limpiarRastro() {
    var g = GRUPOS[modo], v = g.vista;
    api.setCoordSystem(v[0], v[1], v[2], v[3]);  // volver a fijar la vista borra los rastros
  }

  function mostrar() {
    var g = GRUPOS[modo], env = $("env").checked, rastro = $("rastro").checked;
    TODOS.forEach(function (k) { api.setVisible(k, false); api.setTrace(k, false); });
    g.fijos.forEach(function (k) { api.setVisible(k, true); });
    g.vivos.forEach(function (k) { api.setVisible(k, true); });
    g.curvas.forEach(function (k) { api.setVisible(k, env); });
    g.rastro.forEach(function (k) { api.setTrace(k, rastro); });
    var m = T.modos[modo];
    $("formula").textContent = m.formula; $("texto").textContent = m.texto; $("pista").textContent = m.pista;
    $("anim").style.display = g.vivos.length ? "" : "none";
    $("rastro").parentElement.style.display = g.vivos.length ? "" : "none";
    limpiarRastro();
  }

  function cambiarModo(i) {
    modo = i;
    [].forEach.call($("modos").children, function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); });
    mostrar();
  }

  var reloj = null;
  function paso() {
    var ahora = performance.now(), dt = last ? (ahora - last) / 1000 : 0; last = ahora;
    s += dir * dt * 0.22;
    if (s >= 1) { s = 1; dir = -1; } else if (s <= 0) { s = 0; dir = 1; }
    api.setValue("p", s * A);
    api.setValue("t", s * Math.PI / 2);
  }
  function setAnim(on) {
    animando = on; last = 0;
    $("anim").textContent = on ? T.anim[1] : T.anim[0];
    clearInterval(reloj);
    if (on) reloj = setInterval(paso, 30);
  }

  T.modos.forEach(function (m, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "modo"; b.textContent = m.nombre; b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", function () { if (api) { setAnim(false); cambiarModo(i); } });
    $("modos").appendChild(b);
  });
  $("anim").textContent = T.anim[0];
  $("anim").addEventListener("click", function () { setAnim(!animando); });
  $("n").addEventListener("input", function () { $("n-out").textContent = this.value; if (api) api.setValue("n", +this.value); });
  $("env").addEventListener("change", function () { if (api) mostrar(); });
  $("rastro").addEventListener("change", function () { if (api) mostrar(); });

  var toggle = $("theme-toggle");
  function syncIcon() { toggle.textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙"; }
  toggle.addEventListener("click", function () {
    var dark = document.documentElement.dataset.theme !== "dark";
    if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
    syncIcon();
    if (api) pintar();
  });
  syncIcon();

  var params = {
    appName: "classic", width: 820, height: 547, scaleContainerClass: "ggb-wrap",
    showToolBar: false, showAlgebraInput: false, showMenuBar: false, showResetIcon: false,
    enableRightClick: false, enableLabelDrags: false, enableShiftDragZoom: false, perspective: "G",
    borderColor: null, language: en ? "en" : "es", showZoomButtons: false,
    appletOnLoad: function (a) {
      api = a;
      construir();
      cambiarModo(0);
      $("anim").disabled = false;
    }
  };
  var ap = new GGBApplet(params, true);
  window.addEventListener("load", function () { ap.inject("ggb"); });
</script>
</body>
</html>
