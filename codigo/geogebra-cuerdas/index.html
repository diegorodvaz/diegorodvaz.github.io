<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arte con cuerdas · GeoGebra</title>
<meta name="description" content="Applet de GeoGebra: rectas que unen puntos de dos ejes dibujan una parábola que no está trazada en ninguna parte.">
<style>
  :root { --bg: #fff; --fg: #161616; --muted: #666; --primary: #0b7d66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #181818; --fg: #ececec; --muted: #a0a0a0; --primary: #34d3b0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; line-height: 1.55; }
  main { max-width: 760px; margin: 0 auto; padding: 1rem; }
  a { color: var(--primary); }
  h1 { font-size: 1.6rem; margin: 0.6rem 0 0.4rem; }
  p { color: var(--muted); margin: 0 0 1rem; }
  #ggb { width: 100%; max-width: 720px; height: 540px; margin: 0 auto 1rem; }
  .ayuda { font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <a id="volver" href="../../#app-taylor">← Volver al portafolio</a>
  <h1 id="titulo"></h1>
  <p id="intro"></p>
  <div id="ggb"></div>
  <p class="ayuda" id="ayuda"></p>
</main>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<script>
  var en = /[?&]lang=en/.test(location.search);
  var T = en ? {
    titulo: "String art: the hidden parabola",
    intro: "Every line joins a point on the horizontal axis to a point on the vertical one. None of them is a parabola, yet together they draw one.",
    ayuda: "Move the slider to add lines, and tick the box to reveal the curve: it is the envelope of the family, √x + √y = √a, a parabola tilted 45°.",
    volver: "← Back to the portfolio", volverHref: "../../en/",
    slider: "Number of lines", caja: "Show the envelope"
  } : {
    titulo: "Arte con cuerdas: la parábola escondida",
    intro: "Cada recta une un punto del eje horizontal con uno del vertical. Ninguna es una parábola, pero juntas dibujan una.",
    ayuda: "Movés el deslizador para sumar rectas y tildás la casilla para mostrar la curva: es la envolvente de la familia, √x + √y = √a, una parábola girada 45°.",
    volver: "← Volver al portafolio", volverHref: "../../",
    slider: "Cantidad de rectas", caja: "Mostrar la envolvente"
  };
  document.documentElement.lang = en ? "en" : "es";
  document.getElementById("titulo").textContent = T.titulo;
  document.getElementById("intro").textContent = T.intro;
  document.getElementById("ayuda").textContent = T.ayuda;
  document.getElementById("volver").textContent = T.volver;
  document.getElementById("volver").href = T.volverHref;
  document.title = T.titulo + " · GeoGebra";

  var params = {
    appName: "classic", width: 720, height: 540, scaleContainerClass: "ggb-wrap",
    showToolBar: false, showAlgebraInput: false, showMenuBar: false, showResetIcon: false,
    enableRightClick: false, enableLabelDrags: false, enableShiftDragZoom: true, perspective: "G",
    borderColor: null, language: en ? "en" : "es",
    appletOnLoad: function (api) {
      api.evalCommand("a = 10");
      api.evalCommand("n = Slider(2, 60, 1)");
      api.setValue("n", 16);
      api.setCaption("n", T.slider);
      api.setLabelVisible("n", true);
      api.evalCommand("cuerdas = Sequence(Segment((k a / n, 0), (0, a - k a / n)), k, 0, n)");
      api.setColor("cuerdas", 11, 125, 102);
      api.setLineThickness("cuerdas", 2);
      api.evalCommand("envolvente: sqrt(x) + sqrt(y) = sqrt(a)");
      api.setColor("envolvente", 249, 115, 22);
      api.setLineThickness("envolvente", 7);
      api.setVisible("envolvente", false);
      api.evalCommand('mostrar = Checkbox("' + T.caja + '", {envolvente})');
      api.setValue("mostrar", 0);
      api.setVisible("a", false);
      api.setLabelVisible("cuerdas", false);
      api.setLabelVisible("envolvente", false);
      api.setCoordSystem(-1, 12, -1, 14.5);
      api.setCoords("mostrar", 16, 12);
      api.setCoords("n", 16, 76);
      api.setGridVisible(false);
    }
  };
  new GGBApplet(params, true).inject("ggb");
</script>
</body>
</html>
