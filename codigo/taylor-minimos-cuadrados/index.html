<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taylor contra mínimos cuadrados · Streamlit</title>
<meta name="description" content="App de Streamlit que corre en el navegador (stlite): ajuste polinómico de sen x con scikit-learn contra el polinomio de Taylor.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/style.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .volver { display: block; padding: 0.6rem 1rem; font-size: 0.9rem; }
  #cargando { padding: 2rem 1rem; text-align: center; color: #666; }
</style>
</head>
<body>
<a class="volver" href="../../notas/taylor-vs-minimos-cuadrados.html">← Volver a la nota</a>
<div id="root"><p id="cargando">Cargando Python en el navegador (Pyodide, scikit-learn, pandas, seaborn)… la primera vez puede tardar hasta un minuto.</p></div>
<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
  mount(
    {
      entrypoint: "streamlit_app.py",
      streamlitConfig: { "client.toolbarMode": "minimal" },
      requirements: ["numpy", "pandas", "scikit-learn", "matplotlib", "seaborn"],
      files: {
        "streamlit_app.py": { url: "./streamlit_app.py" },
        "ajuste.py": { url: "./ajuste.py" }
      }
    },
    document.getElementById("root")
  );
</script>
</body>
</html>
